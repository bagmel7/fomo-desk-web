<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FOMO Desk" />
    <meta name="theme-color" content="#000000" />
    <meta name="format-detection" content="telephone=no" />
    <title>FOMO Trading Desk</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="lock" class="lock hidden" hidden>
      <div class="lock-inner">
        <p class="lock-kicker">Grok Bot</p>
        <h1>FOMO Trading Desk</h1>
        <p class="lock-copy">Open the private link from Grok Bot to unlock the desk on this iPhone. The app will remember it after that.</p>
      </div>
    </div>

    <div id="app" class="app hidden">
      <div id="banner" class="banner hidden" hidden></div>
      <main id="view" class="view"></main>
      <nav id="tabbar" class="tabbar" aria-label="Main">
        <button type="button" data-tab="home" class="tab-btn is-on">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
          <span>Home</span>
        </button>
        <button type="button" data-tab="agents" class="tab-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm8 0a3 3 0 1 0-3-3 3 3 0 0 0 3 3zM8 12c-2.8 0-5 1.6-5 3.5V19h10v-3.5C13 13.6 10.8 12 8 12zm8 0c-.5 0-1 .07-1.5.2 1.3.8 2.1 2 2.1 3.3V19H21v-3.5c0-1.9-2.2-3.5-5-3.5z"/></svg>
          <span>Agents</span>
        </button>
        <button type="button" data-tab="activity" class="tab-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v3H5zm0 5.5h14v3H5zM5 16h10v3H5z"/></svg>
          <span>Activity</span>
        </button>
        <button type="button" data-tab="account" class="tab-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-3.2 0-7 1.7-7 4v2h14v-2c0-2.3-3.8-4-7-4z"/></svg>
          <span>Account</span>
        </button>
      </nav>
    </div>

    <script src="chart.js"></script>
    <script src="app.js"></script>
  </body>
</html>
